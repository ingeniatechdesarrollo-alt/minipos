<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<title>MiniPOS · Punto de venta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>

<style>
:root{
  --bg:#f3f5f4; --card:#fff; --ink:#15211f; --mut:#5d6b68; --line:#dfe5e3;
  --pri:#0f3d3e; --pri2:#14595b; --acc:#f2a83b; --ok:#1f8a4c; --err:#c0392b; --warn:#d98c00;
  --sel:#fff3d6; --r:10px; --tk:72mm;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);font-weight:600}
label input,label select,label textarea{margin-top:3px;font-weight:400;color:var(--ink);font-size:14px}
h2{margin:0 0 12px;font-size:20px} h3{margin:0;font-size:17px} h4{margin:14px 0 8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--pri2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#2b1a00}
.btn.dan{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.big{padding:14px 18px;font-size:17px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.r{text-align:right} .c{text-align:center} .mut{color:var(--mut)} .b{font-weight:700}
.ok{color:var(--ok)} .err{color:var(--err)} .warn{color:var(--warn)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.row>.btn{flex:0 0 auto;min-width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#e8eeec;color:var(--pri)}
.pill.ok{background:#e1f4e8;color:var(--ok)} .pill.err{background:#fbe4e1;color:var(--err)} .pill.warn{background:#fff1d6;color:#8a5a00}
kbd{display:inline-block;min-width:34px;text-align:center;background:#0b2b2c;color:#ffd58a;border-radius:5px;padding:1px 6px;font:700 12px ui-monospace,Consolas,monospace}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th{position:sticky;top:0;background:#eef2f1;text-align:left;font-size:12px;color:var(--mut);padding:8px;border-bottom:1px solid var(--line);z-index:1}
table.t td{padding:7px 8px;border-bottom:1px solid #edf1f0;vertical-align:middle}
table.t tr:hover td{background:#fafcfb}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);max-height:62vh}
/* top */
header.top{display:flex;align-items:center;gap:14px;background:var(--pri);color:#fff;padding:0 14px;height:52px}
.brand{font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand span{color:var(--acc)}
nav.nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.nav a{color:#cfe3e1;text-decoration:none;padding:15px 11px;white-space:nowrap;font-weight:600;font-size:13px;border-bottom:3px solid transparent}
nav.nav a.on{color:#fff;border-bottom-color:var(--acc)}
.who{display:flex;gap:10px;align-items:center;font-size:12px;white-space:nowrap}
.who .btn{background:transparent;color:#fff;border-color:#3d6b6c;padding:5px 10px}
main#view{padding:14px;height:calc(100vh - 52px);overflow:auto}
/* POS */
.pos{display:grid;grid-template-columns:1fr 330px;gap:14px;height:100%}
.pos-main{display:flex;flex-direction:column;gap:10px;min-height:0}
.scanbar{display:flex;gap:8px}
.scanbar input{font-size:22px;padding:12px 14px;border:2px solid var(--pri);font-family:ui-monospace,Consolas,monospace}
.cart-wrap{flex:1;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table.cart{width:100%;border-collapse:collapse;font-size:15px}
table.cart th{position:sticky;top:0;background:var(--pri);color:#fff;padding:9px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
table.cart td{padding:9px;border-bottom:1px solid #edf1f0}
table.cart tr.sel td{background:var(--sel);font-weight:600}
table.cart tr{cursor:pointer}
.empty{padding:50px;text-align:center;color:var(--mut)}
.pos-foot{display:flex;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13px}
.pos-side{display:flex;flex-direction:column;gap:10px;min-height:0}
.total-box{background:var(--pri);color:#fff;border-radius:var(--r);padding:14px 16px}
.total-box small{opacity:.75;letter-spacing:1px}
.total-box .tt{font-size:42px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.total-box .sub{font-size:12px;opacity:.8;display:flex;justify-content:space-between;margin-top:4px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px;overflow:auto}
.keys button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;cursor:pointer;text-align:left;font-size:12.5px;font-weight:600}
.keys button:hover{border-color:var(--acc);background:#fffaf0}
.keys button.main{grid-column:span 2;background:var(--acc);border-color:var(--acc);font-size:15px;padding:11px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,25,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:520px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:900px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh .x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--mut)}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.list{max-height:48vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.list .it{padding:9px 12px;border-bottom:1px solid #eef2f1;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.list .it.on{background:var(--sel)}
.list .it:hover{background:#f6faf9}
.paybig{font-size:34px;font-weight:800;text-align:center;color:var(--pri)}
.bills{display:flex;gap:6px;flex-wrap:wrap}
.bills .btn{flex:1}
.change{font-size:22px;font-weight:800;text-align:center;padding:8px;border-radius:8px;background:#e1f4e8;color:var(--ok)}
.change.neg{background:#fbe4e1;color:var(--err)}
.weight{font:800 46px ui-monospace,Consolas,monospace;text-align:center;background:#0b2b2c;color:#7cfc9a;border-radius:10px;padding:12px}
.calc{font:700 20px ui-monospace,Consolas,monospace}
.cfg-sec{display:flex;flex-direction:column;gap:10px}
.who .btn.mode{border-color:var(--acc);color:var(--acc)}
/* toasts */
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:#13302f;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:380px;font-size:13px;border-left:4px solid var(--ok)}
.toast.err{border-left-color:var(--err)} .toast.warn{border-left-color:var(--acc)}
/* pages */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.toolbar>label{min-width:140px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kpi div{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--mut)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px;margin-bottom:12px}
.charts .card{height:290px;display:flex;flex-direction:column}
.charts .card h4{margin:0 0 6px;font-size:13px}
.charts canvas{flex:1;min-height:0}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--acc)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f3d3e,#14595b 60%,#1d7173)}
.login .card{width:360px;max-width:92vw;padding:26px}
.login h1{margin:0 0 4px;font-size:26px}
.hint{font-size:12px;background:#f3f7f6;border-radius:8px;padding:10px;color:var(--mut)}
.section{margin-bottom:16px}
.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);font-weight:500}
.chk input{width:auto;margin:0}
/* movil */
.movil{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.m-status{font-size:12px;padding:8px 12px;border-radius:8px;background:#fff;border:1px solid var(--line)}
#mReader{border-radius:12px;overflow:hidden;background:#000}
#mReader:empty{display:none}
.m-manual{display:flex;gap:8px}
.m-manual input{font-size:18px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.pcard .nm{font-size:19px;font-weight:800}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stk div{background:#f3f7f6;border-radius:8px;padding:8px;text-align:center}
.stk b{display:block;font-size:22px}
.mact{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:1000px){.pos{grid-template-columns:1fr}.pos-side{order:-1}.keys{grid-template-columns:repeat(3,1fr)}.total-box .tt{font-size:30px}}
@media(max-width:760px){.who .nm{display:none}.grid2,.grid3{grid-template-columns:1fr}.charts{grid-template-columns:1fr}main#view{padding:10px}}
/* print */
#print-area{display:none}
@media print{
  @page{size:80mm auto;margin:0}
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;left:0;top:0;width:var(--tk);padding:2mm 3mm;font:11.5px/1.25 "Courier New",ui-monospace,monospace;color:#000}
  #print-area table{width:100%;border-collapse:collapse}
  #print-area td{padding:0;vertical-align:top}
  #print-area hr{border:0;border-top:1px dashed #000;margin:4px 0}
  #print-area .big{font-size:15px;font-weight:700}
  #print-area .c{text-align:center} #print-area .r{text-align:right} #print-area .b{font-weight:700}
}
</style>

<body>
<div id="app"></div>
<div id="modals"></div>
<div id="toasts"></div>
<div id="print-area"></div>

<script>
'use strict';
/* =====================================================================
   MiniPOS — Punto de venta para minimercado
   Un solo archivo. Funciona en modo local (localStorage) y se sincroniza
   en tiempo real con Supabase cuando se configura (PC + celulares).
   ===================================================================== */

// ---------- Utilidades ----------
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-CO');
const num=(n,d=2)=>(+n||0).toLocaleString('es-CO',{maximumFractionDigits:d});
const pct=n=>isFinite(n)?(n*100).toFixed(1)+'%':'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fdt=d=>new Date(d).toLocaleString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fhr=d=>new Date(d).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)+1;
const nval=v=>{v=String(v??'').replace(/\$/g,'').replace(/\s/g,'');if(/,\d{1,2}$/.test(v))v=v.replace(/\./g,'').replace(',','.');else v=v.replace(/[.,](?=\d{3}(\D|$))/g,'');return +v||0};
function toast(msg,type='ok',ms=3200){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),ms)}
function downloadCSV(name,rows){const csv=rows.map(r=>r.map(x=>{x=String(x??'');return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click()}
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ');
const phon=w=>w.replace(/igh/g,'ai').replace(/ph/g,'f').replace(/qu/g,'k').replace(/c([ei])/g,'s$1').replace(/c/g,'k').replace(/z/g,'s').replace(/v/g,'b').replace(/ll/g,'y').replace(/(^|[^c])h/g,'$1').replace(/y$/,'i').replace(/w/g,'u').replace(/(.)\1+/g,'$1');
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
const nkg=v=>Math.round((+String(v??'').replace(/\s|kg/gi,'').replace(',','.')||0)*1000)/1000;
function downloadJSON(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=name;a.click()}

// ---------- Almacenamiento (local + Supabase) ----------
const COLLS=['config','usuarios','productos','clientes','ventas','devoluciones','cajas','movimientos','recepciones','espera'];
const DB={
  d:{},sb:null,
  loadLocal(){try{this.d=JSON.parse(localStorage.getItem('minipos_v1'))||{}}catch(e){this.d={}}COLLS.forEach(c=>this.d[c]=this.d[c]||{})},
  persist(){clearTimeout(this._t);this._t=setTimeout(()=>{try{localStorage.setItem('minipos_v1',JSON.stringify(this.d))}catch(e){toast('El almacenamiento local está lleno. Conecte Supabase o exporte un respaldo.','err',6000)}},120)},
  all(c){return Object.values(this.d[c]||{})},
  get(c,id){return (this.d[c]||{})[id]},
  put(c,o){if(!o.id)o.id=uid();o._u=Date.now();this.d[c][o.id]=o;this.persist();
    if(this.sb)this.sb.from('registros').upsert({coleccion:c,id:o.id,data:o,updated_at:new Date().toISOString()}).then(({error})=>{if(error){console.error(error);toast('Error sincronizando: '+error.message,'err')}});
    return o},
  del(c,id){delete this.d[c][id];this.persist();if(this.sb)this.sb.from('registros').delete().match({coleccion:c,id}).then(()=>{})},
  sbCfg(){try{return JSON.parse(localStorage.getItem('minipos_sb')||'null')}catch(e){return null}},
  async connect(){
    const c=this.sbCfg();if(!c||!c.url||!c.key)return false;
    if(!window.supabase){toast('No cargó la librería de Supabase (¿sin internet?). Trabajando en modo local.','warn');return false}
    try{
      const sb=window.supabase.createClient(c.url,c.key);
      let from=0,rows=[];
      for(;;){const{data,error}=await sb.from('registros').select('coleccion,id,data').range(from,from+999);if(error)throw error;rows.push(...data);if(data.length<1000)break;from+=1000}
      this.sb=sb;
      if(rows.length){COLLS.forEach(k=>this.d[k]={});rows.forEach(r=>{(this.d[r.coleccion]=this.d[r.coleccion]||{})[r.id]=r.data});this.persist()}
      else await this.pushAll();
      sb.channel('registros-rt').on('postgres_changes',{event:'*',schema:'public',table:'registros'},p=>{
        if(p.eventType==='DELETE'){const o=p.old||{};if(o.coleccion&&this.d[o.coleccion])delete this.d[o.coleccion][o.id]}
        else{const r=p.new;(this.d[r.coleccion]=this.d[r.coleccion]||{})[r.id]=r.data}
        this.persist();onRemoteChange((p.new||p.old||{}).coleccion);
      }).subscribe();
      return true;
    }catch(e){console.error(e);this.sb=null;toast('No se pudo conectar a Supabase: '+(e.message||e),'err',6000);return false}
  },
  async pushAll(){const rows=[];const now=new Date().toISOString();COLLS.forEach(c=>this.all(c).forEach(o=>rows.push({coleccion:c,id:o.id,data:o,updated_at:now})));
    for(let i=0;i<rows.length;i+=400){const{error}=await this.sb.from('registros').upsert(rows.slice(i,i+400));if(error)throw error}}
};

// ---------- Configuración ----------
const DEF_CFG={id:'main',negocio:'Minimercado Demo',nit:'900.000.000-0',direccion:'Cra 00 # 00-00, Medellín',telefono:'300 000 0000',
  resolucion:'Documento equivalente POS',pie:'¡Gracias por su compra!',consecutivo:1,devConsecutivo:1,recConsecutivo:1,cajaConsecutivo:1,
  papel:80,autoPrint:true,permitirNegativo:true,precioRequiereAdmin:true,bancos:['Nequi','Bancolombia','Daviplata','Banco de Bogotá'],
  siigo:{proxyUrl:'',documentId:'',sellerId:'',pagoEfectivo:'',pagoTransferencia:'',pagoTarjeta:'',iva19:'',iva5:'',ciudad:'05001',depto:'05'},
  impresora:{modo:'navegador',modelo:'Epson TM-T20',columnas:48,cortar:true,cajon:true,avance:4,baud:9600,vid:'',pid:'',idx:''},
  bascula:{activa:false,auto:true,baud:9600,comando:'P',unidad:'kg',vid:'',pid:'',idx:'',prefijo:'20',pluLen:5,modoEtiqueta:'peso'}};
function cfg(){const c=DB.get('config','main')||{};const o=Object.assign({},DEF_CFG,c);['siigo','impresora','bascula'].forEach(k=>o[k]=Object.assign({},DEF_CFG[k],c[k]||{}));return o}
function saveCfg(p){DB.put('config',Object.assign(cfg(),p))}
function nextNum(key){const c=cfg();const n=c[key]||1;c[key]=n+1;DB.put('config',c);return n}

// ---------- Roles ----------
const ROLES={cajero:'Cajero',admin_caja:'Administrador de caja',admin:'Administrador'};
const RANK={cajero:1,admin_caja:2,admin:3};
let USER=null;
const can=min=>!!USER&&RANK[USER.rol]>=RANK[min];

// ---------- Datos demo ----------
function seed(){
  const users=[{usuario:'admin',nombre:'Administrador',clave:'1234',rol:'admin'},{usuario:'supervisor',nombre:'Laura Supervisor',clave:'2222',rol:'admin_caja'},{usuario:'cajero1',nombre:'Andrés Cajero',clave:'1111',rol:'cajero'}];
  users.forEach(u=>DB.put('usuarios',{...u,activo:true}));
  DB.put('config',{...DEF_CFG});
  const P=[
    ['7702115000016','Cigarrillo Boston Azul','Cigarrillería','Coltabaco',540,700,19,640,100,[['Cajetilla x20',20,12500,'7702115000023'],['Cartón x10',200,120000,'7702115000030']]],
    ['7702115100013','Cigarrillo Marlboro Rojo','Cigarrillería','Coltabaco',720,950,19,420,80,[['Cajetilla x20',20,17000,''],['Cartón x10',200,165000,'']]],

const Modal={stack:[],
  open({title,body,footer,wide,onKey,onClose}){
    const ov=document.createElement('div');ov.className='ov';ov.style.zIndex=100+this.stack.length*2;
    ov.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="mh"><h3>${title}</h3><button class="x" title="Esc">✕</button></div><div class="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}</div>`;
    $('#modals').appendChild(ov);const m={el:ov,onKey,onClose};this.stack.push(m);
    ov.querySelector('.x').onclick=()=>this.close(m);
    setTimeout(()=>{const f=ov.querySelector('[autofocus]')||ov.querySelector('.mb input,.mb select,.mb textarea');if(f){f.focus();f.select&&f.select()}},20);
    return m},
  close(m){m=m||this.top();if(!m)return;const i=this.stack.indexOf(m);if(i<0)return;this.stack.splice(i,1);m.el.remove();m.onClose&&m.onClose();if(!this.stack.length)refocus()},
  top(){return this.stack[this.stack.length-1]}
};

function findByCode(code){
  code=String(code).trim();if(!code)return null;
  for(const p of prods()){
    if(p.codigo===code)return{p,presIdx:null};
    const i=(p.presentaciones||[]).findIndex(x=>x.codigo&&x.codigo===code);
    if(i>=0)return{p,presIdx:i+1};
  }return null}
const _ix=new Map();
function pIndex(p){const k=(p._u||0)+'';let x=_ix.get(p.id);if(x&&x.k===k)return x;
  const toks=[...new Set(norm([p.nombre,p.linea,p.empresa,p.claves,p.unidad,(p.presentaciones||[]).map(r=>r.nombre).join(' ')].join(' ')).split(/\s+/).filter(Boolean))];
  x={k,toks,ph:toks.map(phon),codes:[p.codigo,p.plu,...(p.presentaciones||[]).map(r=>r.codigo)].filter(Boolean).map(String)};_ix.set(p.id,x);return x}
function wordScore(q,ix){const pq=phon(q);let best=0;
  ix.toks.forEach((t,i)=>{let s=0;if(t===q)s=5;else if(t.startsWith(q))s=4;else if(q.length>=3&&t.includes(q))s=3;else if(pq.length>=2&&ix.ph[i].startsWith(pq))s=3;
    else if(q.length>=4){const tol=q.length>=7?2:1;if(lev(q,t.slice(0,q.length))<=tol||lev(q,t)<=tol)s=2}if(s>best)best=s});
  if(/^\d+$/.test(q)&&ix.codes.some(c=>c.includes(q)))best=Math.max(best,q.length>=4?5:2);return best}
// Búsqueda inteligente: sin tildes, por partes de palabra, sonido ("lai" = light), errores de digitación y palabras clave
function searchProducts(q,limit=60){const words=norm(q).split(/\s+/).filter(Boolean);
  if(!words.length)return prods().sort((a,b)=>a.nombre.localeCompare(b.nombre)).slice(0,limit);
  const out=[];prods().forEach(p=>{const ix=pIndex(p);let tot=0;for(const w of words){const sc=wordScore(w,ix);if(!sc)return;tot+=sc}out.push([tot,p])});
  return out.sort((a,b)=>b[0]-a[0]||a[1].nombre.localeCompare(b[1].nombre)).slice(0,limit).map(x=>x[1])}

function cajaResumen(caja){
  const ventas=DB.all('ventas').filter(v=>v.cajaId===caja.id&&v.estado!=='anulada').sort((a,b)=>a.numero-b.numero);
  const devs=DB.all('devoluciones').filter(d=>d.cajaId===caja.id);
  let efectivo=0,tarjeta=0,transf=0;const transfers=[],porBanco={};
  ventas.forEach(v=>v.pagos.forEach((p,i)=>{
    if(p.medio==='efectivo')efectivo+=p.monto;
    else if(p.medio==='tarjeta'){tarjeta+=p.monto}
    else{transf+=p.monto;transfers.push({v,p,i});porBanco[p.banco||'Otro']=(porBanco[p.banco||'Otro']||0)+p.monto}}));
  const devEf=devs.reduce((a,d)=>a+d.total,0);
  const ingresos=(caja.movs||[]).filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const egresos=(caja.movs||[]).filter(m=>m.tipo==='egreso').reduce((a,m)=>a+m.monto,0);
  const totalVentas=ventas.reduce((a,v)=>a+v.total,0);
  const esperado=(+caja.base||0)+efectivo-devEf+ingresos-egresos;
  return{ventas,devs,efectivo,tarjeta,transf,transfers,porBanco,devEf,ingresos,egresos,totalVentas,esperado,
    fe:ventas.filter(v=>v.tipoDoc==='FE').length,pos:ventas.filter(v=>v.tipoDoc!=='FE').length}}

  <div class="who"><span id="syncBadge"></span><span id="cajaBadge"></span><span class="nm">${esc(USER.nombre)} · ${ROLES[USER.rol]}</span>${USER.rol!=='cajero'?`<button class="btn mode" onclick="toggleModoCaja()" title="Muestra solo las opciones de caja">${modoCaja()?'⚙ Administración':'🧾 Modo caja'}</button>`:''}<button class="btn" onclick="logout()">Salir</button></div></header><main id="view"></main>`;
  $('#nav').innerHTML=Object.entries(ROUTES).filter(([k,r])=>can(r.min)&&(!modoCaja()||r.caja)).map(([k,r])=>`<a href="#/${k}" data-r="${k}">${r.t}</a>`).join('');
  updateBadges()}
function go(){
  if(!USER)return renderLogin();
  if(!$('#view'))layout();
  let r=location.hash.replace('#/','')||'pos';if(!ROUTES[r]||!can(ROUTES[r].min))r='pos';if(modoCaja()&&!ROUTES[r].caja&&r!=='movil')r='pos';
  ROUTE=r;charts.forEach(c=>c.destroy());charts=[];stopScanner();
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  ROUTES[r].r()}
window.addEventListener('hashchange',go);
// Cajero: solo ve caja. Administradores pueden cambiar a «Modo caja» para vender con el menú limpio.
const modoCaja=()=>!!USER&&(USER.rol==='cajero'||localStorage.getItem('minipos_modocaja_'+USER.id)==='1');
function toggleModoCaja(){const k='minipos_modocaja_'+USER.id;localStorage.setItem(k,modoCaja()?'0':'1');$('#app').innerHTML='';if(location.hash!=='#/pos')location.hash='#/pos';else go()}
function updateBadges(){
  const sb=$('#syncBadge');if(sb)sb.innerHTML=DB.sb?'<span class="pill ok">● En línea</span>':'<span class="pill warn" title="Configure Supabase para sincronizar PC y celulares">● Local</span>';
  const cb=$('#cajaBadge');if(cb){const c=cajaAbierta();cb.innerHTML=c?`<span class="pill ok">Caja #${c.numero} abierta</span>`:'<span class="pill err">Caja cerrada</span>'}}
function onRemoteChange(coll){updateBadges();
  if(Modal.stack.length)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='scan')return;
  if(ROUTE==='inventario'&&coll==='productos')renderInvTable();
  if(ROUTE==='caja'&&(coll==='ventas'||coll==='cajas'))renderCaja()}
function refocus(){if(ROUTE==='pos'){const s=$('#scan');s&&s.focus()}}

// ---------- Login ----------
function renderLogin(){
  $('#app').innerHTML=`<div class="login"><div class="card"><h1>Mini<span style="color:var(--acc)">POS</span></h1><p class="mut" style="margin:0 0 16px">${esc(cfg().negocio)}</p>
  <div style="display:flex;flex-direction:column;gap:12px"><label>Usuario<input id="lgU" autocomplete="username" autofocus></label><label>Clave<input id="lgP" type="password" autocomplete="current-password"></label>
  <button class="btn pri big" id="lgB">Ingresar</button><div class="err b" id="lgE"></div>
  <div class="hint"><b>Demo:</b> admin / 1234 · supervisor / 2222 · cajero1 / 1111<br>${DB.sb?'🟢 Conectado a Supabase':'🟠 Modo local (datos en este navegador)'}</div></div></div></div>`;
  const tryLogin=()=>{const u=$('#lgU').value.trim().toLowerCase(),p=$('#lgP').value;
    const us=DB.all('usuarios').find(x=>x.usuario.toLowerCase()===u&&x.clave===p&&x.activo!==false);
    if(!us){$('#lgE').textContent='Usuario o clave incorrectos';return}
    USER=us;sessionStorage.setItem('minipos_user',us.id);$('#app').innerHTML='';
    const want=innerWidth<760?'#/movil':(location.hash||'#/pos');if(location.hash!==want)location.hash=want;else go()};
  $('#lgB').onclick=tryLogin;$('#lgU').onkeydown=e=>{if(e.key==='Enter')$('#lgP').focus()};$('#lgP').onkeydown=e=>{if(e.key==='Enter')tryLogin()};
  setTimeout(()=>$('#lgU')&&$('#lgU').focus(),30)}
function logout(){USER=null;sessionStorage.removeItem('minipos_user');stopScanner();$('#app').innerHTML='';renderLogin()}

/* =====================================================================
   POS
   ===================================================================== */
let cart={items:[],cliente:null,sel:-1};
const KEYS=[
  ['F4','Cobrar','openPay',1],['F1','Consulta de precios','openConsulta'],['F3','Buscar','openSearch'],['F6','Adicionar producto','openAddProduct'],['F5','Grabar / en espera','holdSale'],
  ['F8','+ Cantidad','qtyUp'],['F9','− Cantidad','qtyDown'],['F2','Cantidad exacta','qtySet'],['Supr','Eliminar ítem','delItem'],
  ['F10','Asignar cliente','openClient'],['F11','Cambiar precio','changePrice'],['F7','Cancelar venta','cancelSale'],['F12','Reimprimir tirilla','reprintLast'],
  ['Ctrl+D','Devolución','openReturn'],['Ctrl+V','Control de ventas','openSalesList']];
function renderPOS(){
  $('#view').innerHTML=`<div class="pos"><section class="pos-main">
    <div class="scanbar"><input id="scan" placeholder="Escanee o digite el código · 3*código = cantidad" autocomplete="off" spellcheck="false"><button class="btn pri" onclick="act('openSearch')">Buscar</button></div>
    <div class="cart-wrap" id="cartWrap"></div>
    <div class="pos-foot"><span>👤 Cliente: <b id="pfCli"></b></span><span>🧾 Ítems: <b id="pfItems">0</b></span><span>Caja: <b id="pfCaja"></b></span><span class="mut">↑ ↓ seleccionar línea · Enter agrega</span></div>
  </section><aside class="pos-side">
    <div class="total-box"><small>TOTAL A PAGAR</small><div class="tt" id="tTotal">$0</div><div class="sub"><span id="tSub"></span><span id="tIva"></span></div></div>
    <div class="keys">${KEYS.map(k=>`<button class="${k[3]?'main':''}" onclick="act('${k[2]}')"><kbd>${k[0]}</kbd>${k[1]}</button>`).join('')}</div>
  </aside></div>`;
  $('#scan').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=$('#scan').value;$('#scan').value='';scan(v)}};
  renderCart();refocus();
  if(!cajaAbierta())setTimeout(()=>{if(ROUTE==='pos'&&!cajaAbierta())openCajaModal(()=>renderCart())},100)}
function renderCart(){
  const w=$('#cartWrap');if(!w)return;
  if(!cart.items.length)w.innerHTML=`<div class="empty"><div style="font-size:40px">🛒</div>Escanee un producto para iniciar la venta<br><small>F3 buscar · F6 adicionar producto · F5 recuperar ventas en espera</small></div>`;
  else w.innerHTML=`<table class="cart"><thead><tr><th>#</th><th>Código</th><th>Descripción</th><th>Presentación</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Total</th></tr></thead><tbody>
   ${cart.items.map((it,i)=>`<tr class="${i===cart.sel?'sel':''}" data-i="${i}"><td>${i+1}</td><td class="mut">${esc(it.codigo)}</td><td>${esc(it.nombre)}${it.precio!==it.precioOrig?' <span class="pill warn">precio modificado</span>':''}</td><td>${esc(it.pres)}</td><td class="r b">${it.pesable?num(it.cant,3)+' kg':num(it.cant)}</td><td class="r">${money(it.precio)}</td><td class="r b">${money(it.precio*it.cant)}</td></tr>`).join('')}</tbody></table>`;
  $$('tr[data-i]',w).forEach(tr=>tr.onclick=()=>{cart.sel=+tr.dataset.i;renderCart();refocus()});
  const sel=$('tr.sel',w);sel&&sel.scrollIntoView({block:'nearest'});
  const t=cartTotals();$('#tTotal').textContent=money(t.total);$('#tSub').textContent='Subtotal '+money(t.sub);$('#tIva').textContent='IVA '+money(t.iva);
  $('#pfCli').textContent=cart.cliente?cart.cliente.nombre+' · '+cart.cliente.doc:'Consumidor final';
  $('#pfItems').textContent=num(cart.items.reduce((a,i)=>a+(i.pesable?1:i.cant),0));
  const c=cajaAbierta();$('#pfCaja').innerHTML=c?`#${c.numero} · ${esc(c.terminal)}`:'<span class="err">CERRADA</span>'}
function cartTotals(){let total=0,sub=0;cart.items.forEach(it=>{const t=it.precio*it.cant;total+=t;sub+=t/(1+(+it.iva||0)/100)});total=Math.round(total);return{total,sub,iva:total-sub}}
function act(name){if(Modal.stack.length)return;const f={openPay,openConsulta,openSearch,openAddProduct,holdSale,qtyUp:()=>chQty(1),qtyDown:()=>chQty(-1),qtySet,delItem,openClient,changePrice,cancelSale,reprintLast,openReturn,openSalesList}[name];f&&f()}
function scan(raw){
  raw=String(raw||'').trim();if(!raw)return;
  let qty=1,code=raw;const m=raw.match(/^(\d+(?:[.,]\d+)?)\s*\*\s*(.+)$/);if(m){qty=nval(m[1])||1;code=m[2].trim()}
  const f=findByCode(code);
  const emb=!f&&parseScaleLabel(code);if(emb){addToCart(emb.p,0,emb.kg);return}
  if(f){if(f.p.pesable)return weighItem(f.p);if(f.presIdx!=null)addToCart(f.p,f.presIdx,qty);else if((f.p.presentaciones||[]).length)choosePres(f.p,qty);else addToCart(f.p,0,qty);return}
  const res=searchProducts(code);
  if(res.length===1&&!/^\d+$/.test(code)){const p=res[0];p.pesable?weighItem(p):((p.presentaciones||[]).length?choosePres(p,qty):addToCart(p,0,qty));return}
  if(/^\d{6,}$/.test(code)){toast('Código '+code+' no existe. Presione F6 para crearlo.','warn');lastUnknown=code;return}
  openSearch(code)}
let lastUnknown='';
function choosePres(p,qty=1){
  const list=presList(p);let i=0;
  const draw=()=>$('#presL',m.el).innerHTML=list.map((x,k)=>`<div class="it ${k===i?'on':''}" data-k="${k}"><span><kbd>${k+1}</kbd> &nbsp;<b>${esc(x.nombre)}</b> <span class="mut">${x.factor>1?'('+x.factor+' und)':''}</span></span><b>${money(x.precio)}</b></div>`).join('');
  const pickIt=k=>{Modal.close(m);addToCart(p,k,qty)};
  const m=Modal.open({title:esc(p.nombre)+' — ¿Cómo lo vende?',body:`<div class="list" id="presL"></div><small class="mut">Use 1-${list.length}, flechas o clic · Stock sala: ${num(p.stockSala)} und</small>`,
    onKey:e=>{if(e.key==='ArrowDown'){i=Math.min(list.length-1,i+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){i=Math.max(0,i-1);draw();e.preventDefault()}
      else if(e.key==='Enter'){e.preventDefault();pickIt(i)}else if(/^[1-9]$/.test(e.key)&&+e.key<=list.length){e.preventDefault();pickIt(+e.key-1)}}});
  draw();$('#presL',m.el).onclick=e=>{const it=e.target.closest('[data-k]');it&&pickIt(+it.dataset.k)}}
function addToCart(p,presIdx,qty=1){
  if(!cajaAbierta()){openCajaModal(()=>addToCart(p,presIdx,qty));return}
  const pr=presList(p)[presIdx||0];
  const need=pr.factor*qty+cart.items.filter(i=>i.pid===p.id).reduce((a,i)=>a+i.cant*i.factor,0);
  if(need>(+p.stockSala||0)){if(!cfg().permitirNegativo){toast('Sin existencias suficientes de '+p.nombre,'err');return}toast(`Stock en sala insuficiente (${num(p.stockSala,3)} ${p.unidad||'und'}) — se vende igual`,'warn')}
  let idx=p.pesable?-1:cart.items.findIndex(i=>i.pid===p.id&&i.factor===pr.factor&&i.precio===i.precioOrig);
  if(idx>=0)cart.items[idx].cant+=qty;
  else{cart.items.push({key:uid(),pid:p.id,codigo:pr.codigo||p.codigo,nombre:p.nombre,pres:pr.nombre,factor:pr.factor,cant:qty,precio:pr.precio,precioOrig:pr.precio,costo:Math.round((+p.costo||0)*pr.factor),iva:+p.iva||0,linea:p.linea||'',empresa:p.empresa||'',pesable:!!p.pesable});idx=cart.items.length-1}
  cart.sel=idx;renderCart();refocus()}
function selItem(){return cart.items[cart.sel]}
function chQty(d){const it=selItem();if(!it)return toast('Seleccione una línea','warn');if(it.pesable){const p=DB.get('productos',it.pid);return p&&weighItem(p,it)}
  if(d<0&&it.cant+d<=0){delItem();return}it.cant+=d;renderCart()}
async function qtySet(){const it=selItem();if(!it)return toast('Seleccione una línea','warn');if(it.pesable){const p=DB.get('productos',it.pid);return p&&weighItem(p,it)}const v=await askNumber('Cantidad exacta',it.nombre+' · '+it.pres,it.cant);if(v==null)return;
  if(v<=0){delItem();return}it.cant=v;renderCart()}
async function delItem(){const it=selItem();if(!it)return toast('Seleccione una línea','warn');
  const a=await askAdmin('Eliminar ítem: '+it.nombre+' x'+it.cant);if(!a)return;
  cart.items.splice(cart.sel,1);cart.sel=Math.min(cart.sel,cart.items.length-1);toast('Ítem eliminado · autorizó '+a.nombre);renderCart()}
async function changePrice(){const it=selItem();if(!it)return toast('Seleccione una línea','warn');
  let a=USER;if(cfg().precioRequiereAdmin){a=await askAdmin('Cambiar precio de '+it.nombre);if(!a)return}
  const v=await askNumber('Nuevo precio unitario',it.nombre+' · '+it.pres+' (actual '+money(it.precio)+')',it.precio);if(v==null||v<0)return;
  it.precio=Math.round(v);it.autorizoPrecio=a.nombre;renderCart()}
async function cancelSale(){if(!cart.items.length)return;if(!(await confirmBox('¿Cancelar la transacción actual? Se borrarán '+cart.items.length+' ítems.')))return;
  cart={items:[],cliente:null,sel:-1};renderCart();toast('Transacción cancelada','warn')}
function holdSale(){
  if(cart.items.length){DB.put('espera',{fecha:new Date().toISOString(),usuario:USER.id,usuarioNombre:USER.nombre,cart:JSON.parse(JSON.stringify(cart)),total:cartTotals().total});
    cart={items:[],cliente:null,sel:-1};renderCart();toast('Venta grabada en espera. F5 con la pantalla vacía para recuperarla.');return}
  const list=DB.all('espera').sort((a,b)=>a.fecha<b.fecha?1:-1);if(!list.length)return toast('No hay ventas en espera','warn');
  let i=0;const draw=()=>$('#espL',m.el).innerHTML=list.map((x,k)=>`<div class="it ${k===i?'on':''}" data-k="${k}"><span>${fhr(x.fecha)} · ${esc(x.usuarioNombre)} · ${x.cart.items.length} ítems${x.cart.cliente?' · '+esc(x.cart.cliente.nombre):''}</span><b>${money(x.total)}</b></div>`).join('');
  const pickIt=k=>{const x=list[k];cart=x.cart;DB.del('espera',x.id);Modal.close(m);renderCart()};
  const m=Modal.open({title:'Ventas en espera',body:`<div class="list" id="espL"></div>`,onKey:e=>{if(e.key==='ArrowDown'){i=Math.min(list.length-1,i+1);draw()}else if(e.key==='ArrowUp'){i=Math.max(0,i-1);draw()}else if(e.key==='Enter'){e.preventDefault();pickIt(i)}}});
  draw();$('#espL',m.el).onclick=e=>{const it=e.target.closest('[data-k]');it&&pickIt(+it.dataset.k)}}
function reprintLast(){const id=localStorage.getItem('minipos_last');const v=id&&DB.get('ventas',id);if(!v)return toast('No hay tirilla para reimprimir','warn');printTicket(v,true)}

// --- Búsqueda F3 ---
function openSearch(q=''){
  let res=[],i=0;
  const m=Modal.open({wide:true,title:'🔎 Buscar producto (F3)',body:`<input id="sq" placeholder="Nombre, código, línea o empresa…" value="${esc(q)}" autofocus style="font-size:18px"><div class="list" id="sL" style="max-height:55vh"></div><small class="mut">↑ ↓ para moverse · Enter para agregar · Esc para salir</small>`,
    onKey:e=>{if(e.key==='ArrowDown'){i=Math.min(res.length-1,i+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){i=Math.max(0,i-1);draw();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();pickIt(i)}}});
  const draw=()=>{$('#sL',m.el).innerHTML=res.length?res.map((p,k)=>`<div class="it ${k===i?'on':''}" data-k="${k}"><span><b>${esc(p.nombre)}</b><br><small class="mut">${esc(p.codigo)} · ${esc(p.linea)} · Sala ${num(p.stockSala)} / Bodega ${num(p.stockBodega)}${(p.presentaciones||[]).length?' · '+p.presentaciones.map(x=>esc(x.nombre)+' '+money(x.precio)).join(' · '):''}</small></span><b>${money(p.precio)}</b></div>`).join(''):'<div class="empty">Sin resultados</div>';
    const on=$('.it.on',m.el);on&&on.scrollIntoView({block:'nearest'})};
  const run=()=>{res=searchProducts($('#sq',m.el).value);i=0;draw()};
  const pickIt=k=>{const p=res[k];if(!p)return;Modal.close(m);p.pesable?weighItem(p):((p.presentaciones||[]).length?choosePres(p):addToCart(p,0,1))};
  $('#sq',m.el).oninput=run;$('#sL',m.el).onclick=e=>{const it=e.target.closest('[data-k]');it&&pickIt(+it.dataset.k)};run()}

  productForm({codigo:code},p=>{if(ROUTE==='pos')addToCart(p,0,1)},'Adicionar producto (F6) — se crea en inventario y se agrega a la venta')}

// --- F10 cliente ---
function openClient(cb){
  let res=[],i=0;
  const m=Modal.open({title:'👤 Asignar cliente (F10)',body:`<input id="cq" placeholder="Documento o nombre…" autofocus><div class="list" id="cL"></div>
    <details><summary class="b" style="cursor:pointer">+ Crear cliente nuevo</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
    <div class="row"><label style="max-width:110px">Tipo<select id="ncT"><option>CC</option><option>NIT</option><option>CE</option><option>PAS</option></select></label><label>Documento<input id="ncD"></label></div>
    <label>Nombre / Razón social<input id="ncN"></label><div class="row"><label>Email (factura)<input id="ncE" type="email"></label><label>Teléfono<input id="ncTel"></label></div>
    <button class="btn pri" id="ncB">Guardar y asignar</button></div></details>`,
    footer:`<button class="btn" id="cCF">Consumidor final</button>`,
    onKey:e=>{if(e.target.id!=='cq')return;if(e.key==='ArrowDown'){i=Math.min(res.length-1,i+1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){i=Math.max(0,i-1);draw();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();res[i]?pickIt(i):($('details',m.el).open=true,$('#ncD',m.el).value=$('#cq',m.el).value,$('#ncN',m.el).focus())}}});
  const draw=()=>$('#cL',m.el).innerHTML=res.map((c,k)=>`<div class="it ${k===i?'on':''}" data-k="${k}"><span><b>${esc(c.nombre)}</b> <small class="mut">${esc(c.tipoDoc)} ${esc(c.doc)}</small></span><small>${esc(c.email||'')}</small></div>`).join('')||'<div class="empty" style="padding:16px">Sin resultados — Enter para crear</div>';
  const run=()=>{const q=$('#cq',m.el).value.toLowerCase();res=DB.all('clientes').filter(c=>(c.doc+' '+c.nombre).toLowerCase().includes(q)).slice(0,30);i=0;draw()};
  const set=c=>{cart.cliente=c?{id:c.id,nombre:c.nombre,doc:c.doc,tipoDoc:c.tipoDoc,email:c.email}:null;Modal.close(m);renderCart();cb&&cb()};
  const pickIt=k=>set(res[k]);
  $('#cq',m.el).oninput=run;$('#cL',m.el).onclick=e=>{const it=e.target.closest('[data-k]');it&&pickIt(+it.dataset.k)};$('#cCF',m.el).onclick=()=>set(null);
  $('#ncB',m.el).onclick=()=>{const d=$('#ncD',m.el).value.trim(),n=$('#ncN',m.el).value.trim();if(!d||!n)return toast('Documento y nombre son obligatorios','err');
    set(DB.put('clientes',{tipoDoc:$('#ncT',m.el).value,doc:d,nombre:n,email:$('#ncE',m.el).value.trim(),tel:$('#ncTel',m.el).value.trim(),direccion:''}))};
  run()}

// --- F4 cobrar ---
function openPay(){
  if(!cart.items.length)return toast('No hay productos en la venta','warn');
  if(!cajaAbierta())return openCajaModal(openPay);
  const total=cartTotals().total;const bancos=cfg().bancos;let lines=[];let tipo='POS';
  const m=Modal.open({title:'💳 Cobrar (F4)',body:`<div class="paybig">${money(total)}</div>
    <div class="row"><label class="chk"><input type="radio" name="td" value="POS" checked> Tirilla POS</label><label class="chk"><input type="radio" name="td" value="FE"> Factura electrónica (Siigo)</label></div>
    <div id="feInfo" class="hint" style="display:none"></div>
    <label>Efectivo recibido<input id="pRec" inputmode="numeric" placeholder="Enter = pago exacto" autofocus style="font-size:24px"></label>
    <div class="bills"><button class="btn" data-b="exact">Exacto</button>${[2000,5000,10000,20000,50000,100000].map(b=>`<button class="btn" data-b="${b}">${money(b)}</button>`).join('')}</div>
    <div><div class="row" style="align-items:center"><b>Transferencias / tarjeta</b><button class="btn sm" id="pAddT" style="flex:0">+ Transferencia</button><button class="btn sm" id="pAddC" style="flex:0">+ Tarjeta</button><button class="btn sm acc" id="pAllT" style="flex:0">Todo por transferencia</button></div>
    <div id="pLines" style="display:flex;flex-direction:column;gap:6px;margin-top:6px"></div></div>
    <div id="pChange" class="change">Cambio: $0</div><div id="pErr" class="err b"></div>`,
    footer:`<button class="btn" data-c>Volver (Esc)</button><button class="btn pri" data-ok style="font-size:16px">Confirmar e imprimir (Enter / F4)</button>`,
    onKey:e=>{if(e.key==='F4'||(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='SELECT')){e.preventDefault();confirm()}}});
  const el=m.el;
  const drawLines=()=>{$('#pLines',el).innerHTML=lines.map((l,k)=>`<div class="row" data-k="${k}" style="gap:6px">
     <label style="max-width:150px">${l.medio==='tarjeta'?'Tarjeta':'Banco'}<select data-f="banco">${(l.medio==='tarjeta'?['Datáfono débito','Datáfono crédito']:bancos).map(b=>`<option ${b===l.banco?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
     <label>${l.medio==='tarjeta'?'Aprobación':'N° transferencia'}<input data-f="ref" value="${esc(l.ref)}"></label>
     <label style="max-width:140px">Monto exacto<input data-f="monto" inputmode="numeric" value="${l.monto||''}"></label>
     <button class="btn sm dan" data-del style="flex:0;margin-bottom:4px">✕</button></div>`).join('');
    $$('[data-k]',$('#pLines',el)).forEach(r=>{const l=lines[+r.dataset.k];
      $$('[data-f]',r).forEach(inp=>inp.oninput=inp.onchange=()=>{l[inp.dataset.f]=inp.dataset.f==='monto'?nval(inp.value):inp.value;calc()});
      $('[data-del]',r).onclick=()=>{lines.splice(+r.dataset.k,1);drawLines();calc()}});calc()};
  const addLine=(medio,monto)=>{const otros=lines.reduce((a,l)=>a+(+l.monto||0),0);lines.push({medio,banco:medio==='tarjeta'?'Datáfono débito':bancos[0],ref:'',monto:monto??Math.max(0,total-otros)});drawLines();
    const rs=$$('#pLines [data-f="ref"]',el);rs.length&&rs[rs.length-1].focus()};
  const calc=()=>{const noEf=lines.reduce((a,l)=>a+(+l.monto||0),0);const necesita=Math.max(0,total-noEf);const recRaw=$('#pRec',el).value.trim();const rec=recRaw===''?necesita:nval(recRaw);
    const ch=rec-necesita;const c=$('#pChange',el);

    return{noEf,necesita,rec,ch}};
  const confirm=()=>{const r=calc();const err=$('#pErr',el);err.textContent='';
    if(r.noEf>total)return err.textContent='Las transferencias/tarjeta no pueden superar el total (no se da cambio de una transferencia).';

    if(tipo==='FE'&&!cart.cliente)return err.textContent='Para factura electrónica asigne un cliente (F10).';
    const pagos=[];if(r.necesita>0)pagos.push({medio:'efectivo',monto:r.necesita});lines.forEach(l=>pagos.push({medio:l.medio,banco:l.banco,ref:String(l.ref).trim(),monto:+l.monto,verificado:false}));
    Modal.close(m);finalizeSale(pagos,r.necesita>0?r.rec:0,r.necesita>0?r.ch:0,tipo)};
  $('#pRec',el).oninput=calc;
  $$('[data-b]',el).forEach(b=>b.onclick=()=>{const r=calc();$('#pRec',el).value=b.dataset.b==='exact'?r.necesita:b.dataset.b;calc();$('#pRec',el).focus()});
  $('#pAddT',el).onclick=()=>addLine('transferencia');$('#pAddC',el).onclick=()=>addLine('tarjeta');
  $('#pAllT',el).onclick=()=>{lines=[];addLine('transferencia',total);$('#pRec',el).value='0';calc()};
  $$('[name=td]',el).forEach(r=>r.onchange=()=>{tipo=r.value;const fi=$('#feInfo',el);
    if(tipo==='FE'){fi.style.display='block';fi.innerHTML=cart.cliente?`Se enviará a Siigo a nombre de <b>${esc(cart.cliente.nombre)}</b> (${esc(cart.cliente.doc)})${cfg().siigo.proxyUrl?'':' — <span class="err">Siigo aún no está configurado: quedará pendiente de envío.</span>'}`:'<span class="err">Asigne un cliente con F10 antes de confirmar.</span> <button class="btn sm" id="feCli">Asignar ahora</button>';
      const b=$('#feCli',el);b&&(b.onclick=()=>openClient(()=>{r.onchange()}))}else fi.style.display='none'});
  $('[data-ok]',el).onclick=confirm;$('[data-c]',el).onclick=()=>Modal.close(m);calc()}
function finalizeSale(pagos,recibido,cambio,tipo){

    items:cart.items.map(({key,...i})=>i),total:t.total,subtotal:Math.round(t.sub),ivaTotal:Math.round(t.iva),pagos,recibido,cambio,tipoDoc:tipo,estado:'ok',siigo:tipo==='FE'?{estado:'pendiente'}:null});
  v.items.forEach(it=>{const p=DB.get('productos',it.pid);if(p)moveStock(p,-it.cant*it.factor,'sala','venta','Venta #'+v.numero)});

/* ---------- Teclado global ---------- */
document.addEventListener('keydown',e=>{
  const isF=/^F([1-9]|1[0-2])$/.test(e.key);
  if(Modal.stack.length){if(isF)e.preventDefault();if(e.key==='Escape'){e.preventDefault();Modal.close();return}const t=Modal.top();t&&t.onKey&&t.onKey(e);return}
  if(!USER||ROUTE!=='pos')return;
  const scanEl=$('#scan');const inScan=document.activeElement===scanEl;
  const map={F1:'openConsulta',F2:'qtySet',F3:'openSearch',F4:'openPay',F5:'holdSale',F6:'openAddProduct',F7:'cancelSale',F8:'qtyUp',F9:'qtyDown',F10:'openClient',F11:'changePrice',F12:'reprintLast'};
  if(isF){e.preventDefault();e.stopPropagation();if(map[e.key])act(map[e.key]);return}
  if(e.ctrlKey&&!e.shiftKey&&(e.key==='d'||e.key==='D')){e.preventDefault();act('openReturn');return}
  if(e.ctrlKey&&!e.shiftKey&&(e.key==='v'||e.key==='V')&&(!inScan||!scanEl.value)){e.preventDefault();act('openSalesList');return}
  if(e.key==='Delete'&&(!inScan||!scanEl.value)){e.preventDefault();act('delItem');return}
  if(e.key==='ArrowDown'&&cart.items.length){e.preventDefault();cart.sel=Math.min(cart.items.length-1,cart.sel+1);renderCart();return}
  if(e.key==='ArrowUp'&&cart.items.length){e.preventDefault();cart.sel=Math.max(0,cart.sel-1);renderCart();return}
  if((e.key==='+'||e.key==='-')&&inScan&&!scanEl.value&&cart.items.length){e.preventDefault();chQty(e.key==='+'?1:-1);return}
  if(!inScan&&e.key.length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){scanEl&&scanEl.focus()}
},true);
window.addEventListener('beforeunload',e=>{if(cart.items.length){e.preventDefault();e.returnValue=''}});

function kardexModal(p){

  Modal.open({wide:true,title:'Kárdex · '+esc(p.nombre),body:`<div class="hint">Sala ${num(p.stockSala)} · Bodega ${num(p.stockBodega)} · Costo promedio ${money(p.costo)}</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Fecha</th><th>Tipo</th><th>Ubic.</th><th class="r">Cant.</th><th>Referencia</th><th>Nota</th><th>Usuario</th><th>Autorizó</th></tr></thead><tbody>
  ${movs.map(x=>`<tr><td>${fdt(x.fecha)}</td><td>${esc(x.tipo)}</td><td>${esc(x.ubic)}</td><td class="r b ${x.cant<0?'err':'ok'}">${x.cant>0?'+':''}${num(x.cant)}</td><td>${esc(x.ref)}</td><td>${esc(x.nota)}</td><td>${esc(x.usuario)}</td><td>${esc(x.autorizo)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Sin movimientos registrados</td></tr>'}</tbody></table></div>`})}
function importCSV(){
  const m=Modal.open({wide:true,title:'Importar productos (CSV)',body:`<p class="mut" style="margin:0">Columnas (separador ; o ,): <code>codigo;nombre;linea;empresa;costo;precio;iva;stockSala;stockBodega;minimo;claves;pesable</code>. Si el código existe se actualiza (sin tocar el stock); si no, se crea.</p>
  <input type="file" id="csvF" accept=".csv,.txt"><textarea id="csvT" rows="10" placeholder="O pegue aquí el contenido…"></textarea><div id="csvR"></div>`,footer:`<button class="btn" data-c>Cerrar</button><button class="btn pri" data-ok>Importar</button>`});
  $('#csvF',m.el).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('#csvT',m.el).value=r.result;r.readAsText(f)};
  $('[data-c]',m.el).onclick=()=>Modal.close(m);
  $('[data-ok]',m.el).onclick=()=>{const lines=$('#csvT',m.el).value.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return toast('No hay datos','err');
    const sep=lines[0].includes(';')?';':',';const H=lines[0].split(sep).map(h=>h.trim().toLowerCase());let cr=0,up=0;
    lines.slice(1).forEach(l=>{const c=l.split(sep);const o={};H.forEach((h,i)=>o[h]=(c[i]||'').trim());if(!o.codigo||!o.nombre)return;
      const ex=findByCode(o.codigo);const base={nombre:o.nombre,linea:o.linea||'',empresa:o.empresa||'',costo:nval(o.costo),precio:nval(o.precio),iva:o.iva===''||o.iva==null?19:nval(o.iva),minimo:nval(o.minimo),claves:o.claves||'',pesable:/^(1|si|sí|true|x)$/i.test(o.pesable||'')};
      if(ex){Object.assign(ex.p,base);DB.put('productos',ex.p);up++}
      else{const p=DB.put('productos',{codigo:o.codigo,...base,stockSala:0,stockBodega:0,unidad:'Unidad',presentaciones:[],activo:true,creado:new Date().toISOString()});
        if(nval(o.stocksala))moveStock(p,nval(o.stocksala),'sala','inicial','Importación');if(nval(o.stockbodega))moveStock(p,nval(o.stockbodega),'bodega','inicial','Importación');cr++}});
    $('#csvR',m.el).innerHTML=`<p class="ok b">Creados: ${cr} · Actualizados: ${up}</p>`;renderInvTable()}}

let recItems=[];
function renderRecepcion(){
  $('#view').innerHTML=`<div class="page-head"><h2>Recibo de mercancía (entrada a bodega)</h2></div>

  <datalist id="dlE2">${empresas().map(l=>`<option>${esc(l)}</option>`).join('')}</datalist>

  <div class="card"><h3>Recibos registrados</h3><div class="tbl-wrap" style="margin-top:8px"><table class="t"><thead><tr><th>#</th><th>Fecha</th><th>Empresa</th><th>Factura</th><th>Destino</th><th class="r">Ítems</th><th class="r">Total</th><th>Usuario</th><th></th></tr></thead><tbody>

  const drawT=()=>{const t=recItems.reduce((a,i)=>a+i.cant*i.costo,0);

    ${recItems.map((i,k)=>{const p=DB.get('productos',i.pid);const pl=presList(p);return`<tr data-k="${k}"><td class="b">${esc(p.nombre)}</td><td><select data-f="pres">${pl.map((x,j)=>`<option value="${j}" ${j===i.pres?'selected':''}>${esc(x.nombre)} (${x.factor})</option>`).join('')}</select></td>
    <td><input data-f="cant" inputmode="numeric" value="${i.cant}"></td><td><input data-f="costo" inputmode="numeric" value="${i.costo}"></td><td class="r">${num(i.cant*pl[i.pres].factor)}</td><td class="r">${money(i.costo/pl[i.pres].factor)}</td><td><input data-f="pv" inputmode="numeric" value="${i.pv}"></td><td class="r b">${money(i.cant*i.costo)}</td><td><button class="btn sm dan" data-d>✕</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="mut">Agregue productos escaneando o buscando.</div>';
    $('#rcTot').textContent='Total recibo '+money(t);
    $$('#rcT [data-k]').forEach(r=>{const i=recItems[+r.dataset.k];$$('[data-f]',r).forEach(inp=>inp.onchange=()=>{const f=inp.dataset.f;if(f==='pres'){const p=DB.get('productos',i.pid);i.pres=+inp.value;i.costo=Math.round(p.costo*presList(p)[i.pres].factor)}else i[f]=nval(inp.value);drawT()});$('[data-d]',r).onclick=()=>{recItems.splice(+r.dataset.k,1);drawT()}})};
  const add=p=>{const ex=recItems.find(i=>i.pid===p.id);if(ex)ex.cant++;else recItems.push({pid:p.id,pres:0,cant:1,costo:+p.costo||0,pv:+p.precio||0});if(!$('#rcE').value&&p.empresa)$('#rcE').value=p.empresa;drawT()};
  $('#rcS').onkeydown=e=>{if(e.key!=='Enter')return;const q=$('#rcS').value.trim();if(!q)return;$('#rcS').value='';const f=findByCode(q);if(f){add(f.p);if(f.presIdx){recItems.find(i=>i.pid===f.p.id).pres=f.presIdx;drawT()}return}

  $('#rcOk').onclick=async()=>{if(!recItems.length)return toast('Agregue productos','err');const ubic=$('#rcU').value;
    if(!(await confirmBox(`Ingresar ${recItems.length} productos a <b>${ubic}</b> por ${money(recItems.reduce((a,i)=>a+i.cant*i.costo,0))}?`,'Guardar recibo')))return;
    const items=[];const updP=$('#rcPr').checked;
    const rec={numero:nextNum('recConsecutivo'),fecha:new Date().toISOString(),empresa:$('#rcE').value.trim(),factura:$('#rcF').value.trim(),ubic,usuario:USER.nombre,items,total:0};
    recItems.forEach(i=>{const p=DB.get('productos',i.pid);const pr=presList(p)[i.pres];const und=i.cant*pr.factor;const cu=i.costo/pr.factor;const st=Math.max(0,stockTotal(p));
      p.costo=Math.round(st+und>0?(st*(+p.costo||0)+und*cu)/(st+und):cu);if(updP&&i.pv>0)p.precio=i.pv;if(rec.empresa&&!p.empresa)p.empresa=rec.empresa;
      moveStock(p,und,ubic,'recepcion','Recibo #'+rec.numero+(rec.factura?' / Fact '+rec.factura:''));items.push({pid:p.id,nombre:p.nombre,pres:pr.nombre,cant:i.cant,und,costo:i.costo,subtotal:i.cant*i.costo})});
    rec.total=items.reduce((a,i)=>a+i.subtotal,0);DB.put('recepciones',rec);recItems=[];toast('Recibo #'+rec.numero+' guardado');renderRecepcion()};
  drawT()}
function pickProduct(list,cb){let i=0;const m=Modal.open({title:'Seleccione producto',body:`<div class="list" id="ppL"></div>`,onKey:e=>{if(e.key==='ArrowDown'){i=Math.min(list.length-1,i+1);d()}else if(e.key==='ArrowUp'){i=Math.max(0,i-1);d()}else if(e.key==='Enter'){e.preventDefault();Modal.close(m);cb(list[i])}}});
  const d=()=>$('#ppL',m.el).innerHTML=list.map((p,k)=>`<div class="it ${k===i?'on':''}" data-k="${k}"><span>${esc(p.nombre)} <small class="mut">${esc(p.codigo)}</small></span><small>Stock ${num(stockTotal(p))}</small></div>`).join('');d();
  $('#ppL',m.el).onclick=e=>{const it=e.target.closest('[data-k]');if(it){Modal.close(m);cb(list[+it.dataset.k])}}}
function printRec(r){printHTML(`<div class="c b big">${esc(cfg().negocio)}</div><hr><div class="b">RECIBO DE MERCANCÍA No. ${r.numero}</div><div>${fdt(r.fecha)}</div><div>Proveedor: ${esc(r.empresa)}</div><div>Factura: ${esc(r.factura)}</div><div>Destino: ${esc(r.ubic)}</div><div>Recibió: ${esc(r.usuario)}</div><hr><table>${r.items.map(i=>`<tr><td colspan=2>${esc(i.nombre)}</td></tr><tr><td>${num(i.cant)} ${esc(i.pres)} x ${money(i.costo)}</td><td class="r">${money(i.subtotal)}</td></tr>`).join('')}</table><hr><div class="b big">TOTAL ${money(r.total)}</div><div class="c">.</div>`)}

function prodPicker(id,label){return`<label>${label}<input id="${id}" list="${id}L" placeholder="Código o nombre"><datalist id="${id}L">${prods().map(p=>`<option value="${esc(p.codigo)} · ${esc(p.nombre)}">`).join('')}</datalist></label>`}
function pickVal(id){const v=$('#'+id).value;const code=v.split(' · ')[0].trim();const f=findByCode(code);if(f)return f.p;const r=searchProducts(v,2);return r.length===1?r[0]:null}
function renderTraslados(){
  $('#view').innerHTML=`<div class="page-head"><h2>Traslados y menudeo</h2></div><div class="grid2">
  <div class="card"><h3>Traslado Bodega ⇄ Sala</h3><p class="mut">Mueve existencias entre la bodega y la sala de ventas.</p>
   ${prodPicker('tP','Producto')}<div class="grid2" style="margin-top:8px"><label>Dirección<select id="tD"><option value="b2s">Bodega → Sala</option><option value="s2b">Sala → Bodega</option></select></label><label>Unidades base<input id="tC" inputmode="numeric"></label></div><div id="tInfo" class="hint" style="margin-top:8px">Seleccione un producto</div><button class="btn pri" id="tOk" style="margin-top:10px">Trasladar</button></div>
  <div class="card"><h3>Menudeo entre productos</h3><p class="mut">Para productos manejados por separado: toma de un producto (ej. cartón o cajetilla) y lo pasa a otro (ej. unidades). El costo se traslada proporcionalmente. <br><b>Nota:</b> si el producto tiene presentaciones (Unidad/Cajetilla/Cartón) el menudeo es automático.</p>
   ${prodPicker('mO','Producto origen')}${prodPicker('mD','Producto destino')}<div class="grid3" style="margin-top:8px"><label>Cantidad origen<input id="mC" inputmode="numeric" value="1"></label><label>Und destino por cada origen<input id="mF" inputmode="numeric" value="20"></label><label>Ubicación<select id="mU"><option value="sala">Sala</option><option value="bodega">Bodega</option></select></label></div>
   <div id="mInfo" class="hint" style="margin-top:8px"></div><button class="btn pri" id="mOk" style="margin-top:10px">Aplicar menudeo</button></div></div>
  <div class="card" style="margin-top:14px"><h3>Últimos traslados y menudeos</h3><div class="tbl-wrap" style="margin-top:8px"><table class="t"><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Ubic.</th><th class="r">Cant.</th><th>Ref.</th><th>Usuario</th></tr></thead><tbody>
  ${DB.all('movimientos').filter(x=>x.tipo==='traslado'||x.tipo==='menudeo').sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,60).map(x=>{const p=DB.get('productos',x.pid);return`<tr><td>${fdt(x.fecha)}</td><td>${esc(p?p.nombre:'?')}</td><td>${x.tipo}</td><td>${x.ubic}</td><td class="r ${x.cant<0?'err':'ok'}">${x.cant>0?'+':''}${num(x.cant)}</td><td>${esc(x.ref)}</td><td>${esc(x.usuario)}</td></tr>`}).join('')||'<tr><td colspan="7" class="mut">Sin registros</td></tr>'}</tbody></table></div></div>`;
  $('#tP').onchange=()=>{const p=pickVal('tP');$('#tInfo').innerHTML=p?`<b>${esc(p.nombre)}</b> · Bodega ${num(p.stockBodega)} · Sala ${num(p.stockSala)}`:'No encontrado'};
  $('#tOk').onclick=()=>{const p=pickVal('tP'),c=nval($('#tC').value);if(!p||!(c>0))return toast('Producto y cantidad','err');const d=$('#tD').value;
    const from=d==='b2s'?'bodega':'sala',to=d==='b2s'?'sala':'bodega';if(c>(from==='bodega'?p.stockBodega:p.stockSala))return toast('No hay suficiente en '+from,'err');
    moveStock(p,-c,from,'traslado','Traslado a '+to);moveStock(p,c,to,'traslado','Traslado desde '+from);toast('Trasladado');renderTraslados()};
  const mi=()=>{const o=pickVal('mO'),d=pickVal('mD');const c=nval($('#mC').value),f=nval($('#mF').value);$('#mInfo').innerHTML=o&&d?`Sale <b>${num(c)}</b> de ${esc(o.nombre)} → entran <b>${num(c*f)}</b> de ${esc(d.nombre)}. Costo destino ≈ ${money(o.costo/f)} c/u`:'Seleccione origen y destino'};

    const und=c*f,cu=o.costo/f,st=Math.max(0,stockTotal(d));d.costo=Math.round(st+und>0?(st*d.costo+und*cu)/(st+und):cu);
    moveStock(o,-c,u,'menudeo','Menudeo → '+d.nombre);moveStock(d,und,u,'menudeo','Menudeo ← '+o.nombre);toast('Menudeo aplicado');renderTraslados()}}

/* =====================================================================
   SUGERIDOS DE PEDIDO POR EMPRESA
   ===================================================================== */
function ventasPorProducto(desde,hasta){const m={};
  DB.all('ventas').forEach(v=>{if(v.estado==='anulada')return;const f=ymd(v.fecha);if(f<desde||f>hasta)return;v.items.forEach(it=>{m[it.pid]=(m[it.pid]||0)+it.cant*it.factor})});
  DB.all('devoluciones').forEach(d=>{const f=ymd(d.fecha);if(f<desde||f>hasta)return;d.items.forEach(it=>{m[it.pid]=(m[it.pid]||0)-it.cant*it.factor})});return m}
function renderSugeridos(){
  $('#view').innerHTML=`<div class="page-head"><h2>Sugeridos de pedido por empresa</h2><div class="row" style="flex:0;flex-wrap:nowrap"><button class="btn" id="sgP">Imprimir</button><button class="btn" id="sgX">Exportar CSV</button></div></div>
  <div class="toolbar"><label>Empresa / proveedor<select id="sgE"><option value="">Todas</option>${empresas().map(e=>`<option>${esc(e)}</option>`).join('')}</select></label><label>Días de historia<input id="sgH" type="number" value="30"></label><label>Días a cubrir<input id="sgC" type="number" value="7"></label><label class="chk" style="min-width:auto"><input type="checkbox" id="sgS" checked> Solo con sugerido</label></div>
  <p class="mut" style="margin-top:-6px">Sugerido = (venta promedio diaria × días a cubrir) + stock mínimo − stock actual. Se redondea a la presentación de compra más grande.</p><div id="sgT"></div>`;
  const run=()=>{const e=$('#sgE').value,h=+$('#sgH').value||30,cv=+$('#sgC').value||7,only=$('#sgS').checked;const hoy=ymd(new Date());const vpp=ventasPorProducto(addDays(hoy,-h+1),hoy);
    const rows=prods().filter(p=>!e||p.empresa===e).map(p=>{const vend=vpp[p.id]||0,vpd=vend/h,st=stockTotal(p);let sug=Math.max(0,Math.ceil(vpd*cv+(+p.minimo||0)-st));
      const big=(p.presentaciones||[]).slice().sort((a,b)=>b.factor-a.factor)[0];let enPres='';if(big&&sug>0){const n=Math.ceil(sug/big.factor);enPres=n+' × '+big.nombre;sug=n*big.factor}
      return{p,vend,vpd,st,dias:vpd>0?st/vpd:Infinity,sug,enPres,costo:sug*(+p.costo||0)}}).filter(r=>!only||r.sug>0).sort((a,b)=>(a.p.empresa||'').localeCompare(b.p.empresa||'')||a.dias-b.dias);
    const groups={};rows.forEach(r=>{(groups[r.p.empresa||'Sin empresa']=groups[r.p.empresa||'Sin empresa']||[]).push(r)});
    $('#sgT').innerHTML=Object.entries(groups).map(([g,rs])=>`<div class="card section"><div class="page-head" style="margin:0 0 8px"><h3>${esc(g)}</h3><b>Pedido estimado: ${money(rs.reduce((a,r)=>a+r.costo,0))}</b></div><div class="tbl-wrap"><table class="t"><thead><tr><th>Producto</th><th class="r">Vendido ${h}d</th><th class="r">Prom/día</th><th class="r">Stock</th><th class="r">Mínimo</th><th class="r">Días inv.</th><th class="r">Sugerido und</th><th>En presentación</th><th class="r">Costo est.</th></tr></thead><tbody>
      ${rs.map(r=>`<tr><td class="b">${esc(r.p.nombre)}</td><td class="r">${num(r.vend)}</td><td class="r">${num(r.vpd,1)}</td><td class="r">${num(r.st)}</td><td class="r">${num(r.p.minimo)}</td><td class="r ${r.dias<3?'err b':(r.dias<cv?'warn':'')}">${isFinite(r.dias)?num(r.dias,1):'∞'}</td><td class="r b">${num(r.sug)}</td><td>${esc(r.enPres)}</td><td class="r">${money(r.costo)}</td></tr>`).join('')}</tbody></table></div></div>`).join('')||'<div class="empty">No hay sugeridos con estos filtros 🎉</div>';
    return rows};
  ['sgE','sgH','sgC','sgS'].forEach(id=>$('#'+id).onchange=run);
  $('#sgX').onclick=()=>{const r=run();downloadCSV('sugerido_'+($('#sgE').value||'todas'),[['Empresa','Codigo','Producto','Vendido','PromDia','Stock','Minimo','DiasInv','SugeridoUnd','Presentacion','CostoEst'],...r.map(x=>[x.p.empresa,x.p.codigo,x.p.nombre,x.vend,x.vpd.toFixed(2),x.st,x.p.minimo,isFinite(x.dias)?x.dias.toFixed(1):'',x.sug,x.enPres,Math.round(x.costo)])])};
  $('#sgP').onclick=()=>{const r=run();printHTML(`<div class="c b big">${esc(cfg().negocio)}</div><div class="c b">SUGERIDO DE PEDIDO</div><div>${esc($('#sgE').value||'Todas las empresas')}</div><div>${fdt(new Date())}</div><hr><table>${r.map(x=>`<tr><td>${esc(x.p.nombre)}</td><td class="r b">${x.enPres||num(x.sug)}</td></tr>`).join('')}</table><hr><div class="b">Total est. ${money(r.reduce((a,x)=>a+x.costo,0))}</div><div class="c">.</div>`)};
  run()}

/* =====================================================================
   ANÁLISIS DE VENTAS Y MERCADEO
   ===================================================================== */
let anTab='consulta',anData=null;
function renderAnalisis(){
  const hoy=ymd(new Date());const us=DB.all('usuarios');
  $('#view').innerHTML=`<div class="page-head"><h2>Análisis de ventas, inventario y mercadeo</h2></div>

function analizar(f){

    const k=v.total?vt/v.total:0;v.pagos.forEach(p=>{const key=p.medio==='efectivo'?'Efectivo':(p.medio==='tarjeta'?'Tarjeta':(p.banco||'Transferencia'));medios[key]=(medios[key]||0)+p.monto*k});

    bajoMin:all.filter(p=>p.activo!==false&&stockTotal(p)<=(+p.minimo||0)).length}}

async function siigoCall(action,payload){
  const s=cfg().siigo;if(!s.proxyUrl)throw new Error('Configure la URL del proxy de Siigo en Configuración');
  const sb=DB.sbCfg()||{};const h={'Content-Type':'application/json'};if(sb.key){h.Authorization='Bearer '+sb.key;h.apikey=sb.key}
  const r=await fetch(s.proxyUrl,{method:'POST',headers:h,body:JSON.stringify({action,payload})});const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error||j.Errors){const e=j.Errors?j.Errors.map(x=>x.Message||x.Code).join(' · '):(j.error||('HTTP '+r.status));throw new Error(e)}return j}
function buildSiigo(v){const s=cfg().siigo;const d=new Date(v.fecha);
  const taxId=iva=>iva==19?s.iva19:(iva==5?s.iva5:'');
  const payId=p=>p.medio==='efectivo'?s.pagoEfectivo:(p.medio==='tarjeta'?s.pagoTarjeta:s.pagoTransferencia);
  return{document:{id:+s.documentId},date:ymd(d),customer:{identification:v.cliente.doc.replace(/-\d$/,'').replace(/\D/g,''),branch_office:0},seller:+s.sellerId,
    observations:`Tirilla POS #${v.numero} · ${v.pagos.map(p=>p.ref?((p.banco||p.medio)+' #'+p.ref):p.medio).join(', ')}`,
    stamp:{send:true},mail:{send:!!(v.cliente.email)},
    items:v.items.map(it=>{const base=it.precio/(1+(+it.iva||0)/100);const o={code:it.codigo,description:it.nombre+(it.factor>1?' ('+it.pres+')':''),quantity:it.cant,price:+base.toFixed(2),discount:0};const t=taxId(it.iva);if(t)o.taxes=[{id:+t}];return o}),
    payments:v.pagos.map(p=>({id:+payId(p),value:Math.round(p.monto),due_date:ymd(d)}))}}
async function enviarSiigo(v){
  if(!v.cliente){v.siigo={estado:'error',msg:'Falta cliente'};DB.put('ventas',v);return}
  if(!cfg().siigo.proxyUrl){v.siigo={estado:'pendiente',msg:'Siigo no configurado'};DB.put('ventas',v);toast('FE #'+v.numero+' quedó pendiente (Siigo no configurado)','warn');return}
  try{const r=await siigoCall('invoice',{invoice:buildSiigo(v),customer:{tipoDoc:v.cliente.tipoDoc,doc:v.cliente.doc,nombre:v.cliente.nombre,email:v.cliente.email,depto:cfg().siigo.depto,ciudad:cfg().siigo.ciudad}});
    v.siigo={estado:'enviada',id:r.id,numero:r.name||r.number||'',fecha:new Date().toISOString()};toast('Factura electrónica '+(v.siigo.numero||'')+' enviada a Siigo ✔')}
  catch(e){v.siigo={estado:'error',msg:e.message};toast('Siigo: '+e.message,'err',7000)}
  DB.put('ventas',v)}

/* =====================================================================
   DISPOSITIVOS: puertos serial/USB (Web Serial, Chrome/Edge en PC)
   ===================================================================== */
const unesc=s=>String(s||'').replace(/\\r/g,'\r').replace(/\\n/g,'\n').replace(/\\x([0-9a-f]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
const Serial={ports:{},
  forget(kind){const p=this.ports[kind];delete this.ports[kind];if(p&&p.readable)p.close().catch(()=>{})},
  async get(kind,ask){
    if(!('serial' in navigator))throw new Error('Este navegador no permite conexión USB/serial. Use Chrome o Edge en el PC.');
    const cur=this.ports[kind];if(cur&&cur.writable)return cur;
    const c=cfg()[kind];const list=await navigator.serial.getPorts();let port=null;
    if(!ask){if(c.vid)port=list.find(p=>{const i=p.getInfo();return i.usbVendorId==c.vid&&i.usbProductId==c.pid});else if(c.idx!==''&&c.idx!=null)port=list[+c.idx]}
    if(!port&&ask){port=await navigator.serial.requestPort();const i=port.getInfo();const l2=await navigator.serial.getPorts();saveCfg({[kind]:{...cfg()[kind],vid:i.usbVendorId||'',pid:i.usbProductId||'',idx:l2.indexOf(port)}})}
    if(!port)throw new Error((kind==='impresora'?'Impresora':'Báscula')+' no vinculada en este equipo (Configuración → «Vincular»).');
    if(!port.writable)await port.open({baudRate:+c.baud||9600});
    this.ports[kind]=port;return port}};
const Scale={last:'',
  async read(){const c=cfg().bascula;const port=await Serial.get('bascula',false);
    if(c.comando){const w=port.writable.getWriter();try{await w.write(new TextEncoder().encode(unesc(c.comando)))}finally{w.releaseLock()}}
    const reader=port.readable.getReader();let buf='',last=0;const t0=Date.now();
    try{while(Date.now()-t0<1500){const r=await Promise.race([reader.read(),new Promise(res=>setTimeout(()=>res({to:1}),200))]);
      if(r.to){if(buf&&Date.now()-last>180)break;continue}if(r.done)break;buf+=new TextDecoder().decode(r.value);last=Date.now();if(buf.length>400)buf=buf.slice(-400)}}
    finally{try{await reader.cancel()}catch(e){}try{reader.releaseLock()}catch(e){}}
    this.last=buf.replace(/[\x00-\x1f]/g,'⏎').slice(-60);
    const nums=[...buf.matchAll(/-?\d+(?:[.,]\d+)?/g)].map(m=>m[0]);
    if(!nums.length)throw new Error('La báscula no respondió. Revise cable, velocidad ('+c.baud+') y comando.');
    let v=+(c.comando||nums.length<2?nums[nums.length-1]:nums[nums.length-2]).replace(',','.');if(c.unidad==='g')v/=1000;
    return Math.round(Math.abs(v)*1000)/1000}};
// Convierte la tirilla HTML en texto de columnas fijas para ESC/POS
function htmlToLines(html,w){const box=document.createElement('div');box.innerHTML=html;const out=[];
  const wrap=s=>{const r=[];s=String(s).replace(/\s+/g,' ').trim();while(s.length>w){let i=s.lastIndexOf(' ',w);if(i<=0)i=w;r.push(s.slice(0,i));s=s.slice(i).trim()}if(s)r.push(s);return r};
  const txt=n=>{const t=document.createElement('div');t.innerHTML=n.innerHTML.replace(/<br\s*\/?>/gi,'\n');return t.textContent};
  [...box.childNodes].forEach(n=>{
    if(n.nodeType!==1){const t=(n.textContent||'').trim();if(t)wrap(t).forEach(x=>out.push({t:x}));return}
    const cl=n.classList,align=cl.contains('c')?1:(cl.contains('r')?2:0),big=cl.contains('big'),bold=big||cl.contains('b');
    if(n.tagName==='HR'){out.push({t:'-'.repeat(w)});return}
    if(n.tagName==='BR'){out.push({t:''});return}
    if(n.tagName==='TABLE'){[...n.querySelectorAll('tr')].forEach(tr=>{const tds=[...tr.children];const b=tds.some(td=>td.classList.contains('b')||td.classList.contains('big'));const bg=tds.some(td=>td.classList.contains('big'));
      if(tds.length===1)wrap(txt(tds[0])).forEach(x=>out.push({t:x,bold:b,big:bg}));
      else{const L=txt(tds[0]).replace(/\s+/g,' ').trim(),Rr=txt(tds[tds.length-1]).replace(/\s+/g,' ').trim();
        if(L.length+Rr.length+1<=w)out.push({t:L+' '.repeat(w-L.length-Rr.length)+Rr,bold:b,big:bg});else{wrap(L).forEach(x=>out.push({t:x,bold:b}));out.push({t:' '.repeat(Math.max(0,w-Rr.length))+Rr,bold:b,big:bg})}}});return}
    txt(n).split('\n').forEach(line=>wrap(line).forEach(x=>out.push({t:x,align,bold,big})))});
  return out}
function escposBytes(lines,o){const b=[0x1b,0x40,0x1b,0x74,16];const enc=s=>{for(const ch of s){const c=ch.charCodeAt(0);b.push(c<256?c:(ch==='·'?0xb7:0x3f))}};
  if(o.cajon)b.push(0x1b,0x70,0,25,250);
  lines.forEach(l=>{b.push(0x1b,0x61,l.align||0,0x1b,0x45,l.bold?1:0,0x1d,0x21,l.big?0x01:0);enc(l.t);b.push(0x0a)});
  b.push(0x1b,0x61,0,0x1b,0x45,0,0x1d,0x21,0);for(let i=0;i<(o.avance||4);i++)b.push(0x0a);
  if(o.cortar)b.push(0x1d,0x56,0x42,0);return new Uint8Array(b)}
const Printer={
  async write(bytes){const port=await Serial.get('impresora',false);const w=port.writable.getWriter();try{await w.write(bytes)}finally{w.releaseLock()}},
  async printHTML(html,opts={}){const c=cfg().impresora;await this.write(escposBytes(htmlToLines(html,+c.columnas||48),{cortar:c.cortar,cajon:opts.cajon&&c.cajon,avance:+c.avance||4}))},
  async kick(){await this.write(new Uint8Array([0x1b,0x40,0x1b,0x70,0,25,250]))}};

/* =====================================================================
   VENTA POR PESO (gramera)
   ===================================================================== */
function parseScaleLabel(code){const b=cfg().bascula;const pre=String(b.prefijo||'');
  if(!pre||!/^\d{13}$/.test(code)||!code.startsWith(pre))return null;
  const L=+b.pluLen||5;const plu=code.substr(pre.length,L);const val=+code.substring(pre.length+L,12);
  const p=prods().find(x=>x.pesable&&(x.codigo===plu||+x.codigo===+plu||(x.plu&&+x.plu===+plu)));if(!p||!val)return null;
  return{p,kg:b.modoEtiqueta==='precio'?Math.round(val/p.precio*1000)/1000:val/1000}}
function weighItem(p,line){
  if(!cajaAbierta())return openCajaModal(()=>weighItem(p,line));
  const b=cfg().bascula;let poll=null,kg=line?line.cant:0,busy=false;
  const m=Modal.open({title:'⚖️ '+esc(p.nombre)+' — venta por peso',body:`<div class="weight" id="wD">0,000 kg</div>
    <div class="row" style="align-items:center"><span>Precio: <b>${money(p.precio)}</b> / ${esc(p.unidad||'kg')}</span><b id="wT" style="text-align:right;font-size:22px">$0</b></div>
    <label>Peso en kg (digítelo si no hay báscula · ej. 0,750)<input id="wIn" inputmode="decimal" value="${kg?String(kg).replace('.',','):''}" autofocus style="font-size:24px"></label>
    <div class="row" style="align-items:center"><button class="btn acc" id="wRead">⚖️ Leer báscula</button><label class="chk" style="flex:0 0 auto"><input type="checkbox" id="wAuto" ${b.activa&&b.auto?'checked':''}> Lectura automática</label></div>
    <div id="wMsg" class="mut">${b.activa?'':'Báscula no activada: digite el peso o actívela en Configuración → Báscula.'}</div>`,
    footer:`<button class="btn" data-c>Cancelar (Esc)</button><button class="btn pri" data-ok>${line?'Actualizar peso':'Agregar a la venta'} (Enter)</button>`,
    onKey:e=>{if(e.key==='Enter'){e.preventDefault();ok()}},onClose:()=>{clearInterval(poll);poll=null}});
  const el=m.el;
  const upd=()=>{kg=nkg($('#wIn',el).value);$('#wD',el).textContent=kg.toLocaleString('es-CO',{minimumFractionDigits:3,maximumFractionDigits:3})+' kg';$('#wT',el).textContent=money(kg*p.precio)};
  const stopAuto=msg=>{clearInterval(poll);poll=null;$('#wAuto',el).checked=false;if(msg)$('#wMsg',el).innerHTML=msg};
  const read=async silent=>{try{const w=await Scale.read();if(!Modal.stack.includes(m))return;$('#wIn',el).value=String(w).replace('.',',');upd();$('#wMsg',el).textContent='Peso leído de la báscula · '+new Date().toLocaleTimeString('es-CO')}
    catch(e){if(!Modal.stack.includes(m))return;stopAuto('<span class="err">'+esc(e.message)+'</span> Digite el peso manualmente.')}};
  const tick=async()=>{if(busy)return;busy=true;await read(true);busy=false};
  const setAuto=()=>{clearInterval(poll);poll=null;if($('#wAuto',el).checked){tick();poll=setInterval(tick,900)}};
  $('#wAuto',el).onchange=setAuto;$('#wRead',el).onclick=()=>read(false);
  $('#wIn',el).oninput=()=>{if(poll)stopAuto();upd()};
  const ok=()=>{upd();if(!(kg>0)){$('#wMsg',el).innerHTML='<span class="err">Ingrese o lea un peso mayor a 0</span>';return}
    Modal.close(m);if(line){line.cant=kg;renderCart()}else addToCart(p,0,kg)};
  $('[data-ok]',el).onclick=ok;$('[data-c]',el).onclick=()=>Modal.close(m);
  upd();if(b.activa&&b.auto)setAuto()}

/* =====================================================================
   F1 · CONSULTA DE PRECIOS + CALCULADORA (no agrega a la venta)
   ===================================================================== */
function openConsulta(){
  let res=[];
  const m=Modal.open({wide:true,title:'🔎 Consulta de precios (F1) — no se agrega a la venta',body:`<input id="qq" placeholder="Escanee o escriba: cerveza · aguila lai · 7702…" autofocus style="font-size:18px">
    <div class="list" id="qL" style="max-height:42vh"></div>
    <div class="card" style="padding:10px 12px"><b>Calculadora</b> <small class="mut">ej.: 12500*3+2000 · 4200*0,750</small><div class="row" style="align-items:center"><input id="qc" class="calc" placeholder="0"><div class="calc" id="qcr" style="text-align:right">= $0</div></div></div>`});
  const el=m.el;
  const draw=()=>{$('#qL',el).innerHTML=res.map((p,k)=>`<div class="it"><span><b>${esc(p.nombre)}</b><br><small class="mut">${esc(p.codigo)} · ${esc(p.linea)} · Sala ${num(p.stockSala,3)} / Bodega ${num(p.stockBodega,3)} ${esc(p.unidad||'')}</small></span>
    <span style="text-align:right">${presList(p).map(x=>`<div><small>${esc(x.nombre)}</small> <b style="font-size:16px">${money(x.precio)}</b>${p.pesable?' /kg':''}</div>`).join('')}<button class="btn sm" data-k="${k}" style="margin-top:4px">Agregar a la venta</button></span></div>`).join('')||'<div class="empty" style="padding:16px">Escanee o escriba para consultar</div>'};
  const run=()=>{const q=$('#qq',el).value.trim();const f=q&&findByCode(q);res=f?[f.p]:(q?searchProducts(q,30):[]);draw()};
  $('#qq',el).oninput=run;$('#qq',el).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run();$('#qq',el).select()}};
  $('#qL',el).onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const p=res[+b.dataset.k];Modal.close(m);p.pesable?weighItem(p):((p.presentaciones||[]).length?choosePres(p):addToCart(p,0,1))};
  const calc=()=>{const s=$('#qc',el).value.replace(/\$|\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(/,/g,'.').replace(/x/gi,'*');
    if(!/^[\d+\-*/().%]*$/.test(s)){$('#qcr',el).textContent='= ?';return}try{const r=Function('"use strict";return ('+(s||'0')+')')();$('#qcr',el).textContent='= '+(isFinite(r)?money(r):'…')}catch(e){$('#qcr',el).textContent='= …'}};
  $('#qc',el).oninput=calc;draw()}

  DB.loadLocal();
  const connected=await DB.connect();
  if(!DB.all('usuarios').length){seed();if(connected)await DB.pushAll().catch(e=>toast(e.message,'err'))}
  const uidS=sessionStorage.getItem('minipos_user');if(uidS)USER=DB.get('usuarios',uidS)||null;
  go()})();
</script>
